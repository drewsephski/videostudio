<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Krafty — Real work</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/botfont.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/botfont.woff2) format('woff2'); font-weight: 200 800; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    --bg: #161615; --ink: #faf4e6; --ink-2: #a6a6a6; --accent: #34d399; --card: #202020; --card-2: #2b2b2a; --line: #333331;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: -0.045em;
             line-height: 0.95; white-space: nowrap; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .card { position: absolute; background: var(--card); border-radius: 28px; border: 1px solid #ffffff12;
          box-shadow: 0 2px 6px rgba(0,0,0,.35), 0 40px 90px -24px rgba(0,0,0,.75); }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
